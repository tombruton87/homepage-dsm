# Homepage on the DSM app chassis. Read by chassis/build.sh and the tests.
PKG_NAME=homepage
PKG_TITLE="Homepage"
PKG_DESC="Homepage, a start page for everything on your Synology, in Container Manager — filled in for you: DSM and its live stats, every app installed from this family of packages, and your other containers, each with up/down and response time; links of your own, a look of your choosing, and YAML you can still edit in File Station."
APP_ID="Homepage.AppInstance"
REPO=tombruton87/homepage-dsm
SERVICES="server"
VOLUMES=""
IMAGE_VARS="HP_IMAGE"
PORT=3010
PORTS="3010 3011 3020 8095"
HEALTH_PATH=/api/healthcheck
APP_ACTIONS="rescan|toggle|linkadd|linkdel|look|dsmset|dsmtest|dsmoff|manual"
APP_ANSWER_KEYS="HP_TITLE"
APP_REQUEST_KEYS="ITEM HIDE NAME_B64 URL_B64 GROUP_B64 ICON_B64 TITLE_B64 THEME COLOR SEARCH CLOCK DSM_USER_B64 DSM_PASS_B64 DSM_VOLUME"
TAGLINE="start page"
WELCOME="Homepage is a fast, good-looking start page for your home network. This package fills it in for you — DSM with its live stats, the other apps from this family of packages, and your containers, each showing whether it's up — and keeps it current as things change. Open it on any device, or set it as your browser's home page."
BACKUP_WHAT="the dashboard's settings and links, and Homepage's configuration folder (the YAML files and any images you added)."
SITE_NOTE="The address you open Homepage at. Homepage refuses requests for addresses it hasn't been told about, so the package tells it this one (and this Synology's own address) whenever it changes."
ICON_TOP="#334155"
ICON_BOTTOM="#0f172a"
ICON_LETTER="H"   # only if icon.png is missing
BETA=yes
